name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sdkmanager は JDK 17 以上が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      # AGP 4.2.2 / Gradle 6.7.1 は JDK 11 でビルドする
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'

      - name: Unzip project (if a zip is in the repo)
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -o -q "$z" -d _src
          done
          true

      - name: Locate project directory
        id: loc
        run: |
          f=$(grep -rl "rootProject.name = 'gtrxac'" --include=settings.gradle . | head -n1)
          if [ -z "$f" ]; then echo "settings.gradle not found"; find . -maxdepth 3 -not -path './.git/*'; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gtrxac-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
